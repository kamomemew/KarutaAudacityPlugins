<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>CSV → OTIO JSON Converter</title>
    <meta name="description" content="CSVから動画自動編集用のファイルが作れます。">
    <meta name="keywords" content="競技かるた, 百人一首, 動画編集">
    <meta property="og:title" content="CSV → OTIO JSON Converter">
    <meta property="og:description" content="CSVから動画自動編集用のファイルが作れます。">
    <meta property="og:url" content="https://kamomemew.github.io/KarutaAudacityPlugins/otio_maker.html">
    <meta name="twitter:card" content="summary">
    <meta property="og:image" content="https://kamomemew.github.io/KarutaAudacityPlugins/resources/favicon.png">
    
    <link rel="shortcut icon" href="https://kamomemew.github.io/KarutaAudacityPlugins/resources/favicon.ico" type="image/vnd.microsoft.icon">
    <link rel="icon" href="https://kamomemew.github.io/KarutaAudacityPlugins/resources/favicon.ico" type="image/vnd.microsoft.icon">
    <link rel="apple-touch-icon" href="https://kamomemew.github.io/KarutaAudacityPlugins/resources/favicon.png" >
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src=" https://cdn.jsdelivr.net/npm/decimal@0.0.2/lib/decimal.min.js "></script>
</head>

<body class="bg-light">
          <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
            <div class="container-fluid">
                <a class="navbar-brand" href="#"><img class="mx-3" src="./resources/favicon.png" width="46" height="46">競技かるた読み抽出プラグイン</a>
                <div class="collapse navbar-collapse" id="navbarSupportedContent">
                    <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
                        <li class="nav-item"><a class="nav-link" aria-current="page" href="./index.html">Home</a></li>
                        <li class="nav-item"><a class="nav-link active" href="#">動画編集</a></li>
                    </ul>
                </div>
            </div>
        </nav>
<div class="container py-5">
    <h1 class="mb-4">CSV → OTIO JSON Converter</h1>
    <div class="ms-4"><p>CSVファイルと動画ファイルを選択してください。このページで出力されたotioファイルを動画編集ソフトに読み込ませることで
        自動でカット編集ができます。
    </p></div>
    <div class="card p-4 shadow-sm">
        <div class="mb-3">
            <label class="form-label">CSV ファイルを選択</label>
            <input type="file" id="csvFile" class="form-control" accept=".csv,.tsv,.txt">
        </div>

        <div class="mb-3">
            <label class="form-label">動画ファイルを選択（OTIO 内で参照されます）</label>
            <input type="file" id="videoPath" class="form-control" accept=".mov,.mp4,.ogv,.avi,.wmv,.webm,.mkv">
        </div>

        <button class="btn btn-primary" onclick="convert()">変換する</button>
    </div>

    <div class="mt-4">
        <h4>生成された JSON</h4>
        <textarea id="output" class="form-control" rows="20"></textarea>
        <button class="btn btn-success mt-3" onclick="downloadJSON()">JSON をダウンロード</button>
    </div>
</div>

<script>
function parseDelimited(text) {
    const isTSV = text.includes("\t");
    const delimiter = isTSV ? "\t" : ",";

    const lines = text.trim().split("\n");
    const ranges = [];

    for (let line of lines) {
        if (line.startsWith("#") || line.trim() === "") continue;
        const parts = line.split(delimiter);

        if (parts.length < 2) continue;

        const start = Decimal(parts[0]);
        const end = Decimal(parts[1]);
        const name = parts[2] ? parts[2].trim() : `${start}_${end}`;

        ranges.push([start, end, name]);
    }
    return ranges;
}


function emitClip(start, end, name, fps, videoPath) {
    const startVal = start.mul(fps);
    const durVal = (end.sub(start)).mul(fps);
    return `                    {
                        "OTIO_SCHEMA": "Clip.2",
                        "name": "${name}",
                        "source_range": {
                            "OTIO_SCHEMA": "TimeRange.1",
                            "duration": {
                                "OTIO_SCHEMA": "RationalTime.1",
                                "rate": ${fps},
                                "value": ${durVal}
                            },
                            "start_time": {
                                "OTIO_SCHEMA": "RationalTime.1",
                                "rate": ${fps},
                                "value": ${startVal}
                            }
                        },
                        "enabled": true,
                        "color": null,
                        "media_references": {
                            "DEFAULT_MEDIA": {
                                "OTIO_SCHEMA": "ExternalReference.1",
                                "name": "",
                                "available_range": null,
                                "available_image_bounds": null,
                                "target_url": "${videoPath}"
                            }
                        },
                        "active_media_reference_key": "DEFAULT_MEDIA"
                    }`;
}

function buildOTIO(ranges, fps, videoPath) {
    let videoClips = "";
    let audioClips = "";

    ranges.forEach((r, i) => {
        const clip = emitClip(r[0], r[1], r[2], fps, videoPath);
        videoClips += clip + (i < ranges.length - 1 ? ",\n" : "");
        audioClips += clip + (i < ranges.length - 1 ? ",\n" : "");
    });

    return `{
    "OTIO_SCHEMA": "Timeline.1",
    "name": "CutTimeline",
    "global_start_time": {
        "OTIO_SCHEMA": "RationalTime.1",
        "rate": ${fps},
        "value": 0.0
    },
    "tracks": {
        "OTIO_SCHEMA": "Stack.1",
        "name": "tracks",
        "source_range": null,
        "enabled": true,
        "color": null,
        "children": [
            {
                "OTIO_SCHEMA": "Track.1",
                "name": "Video",
                "source_range": null,
                "enabled": true,
                "color": null,
                "children": [
${videoClips}
                ],
                "kind": "Video"
            },
            {
                "OTIO_SCHEMA": "Track.1",
                "name": "Audio",
                "source_range": null,
                "enabled": true,
                "color": null,
                "children": [
${audioClips}
                ],
                "kind": "Audio"
            }
        ]
    }
}`;
}

function convert() {
    const file = document.getElementById("csvFile").files[0];
    const videoPath = document.getElementById("videoPath").files[0].name;
    const fps = Decimal(60.0);
    if (!file) {
        alert("CSV ファイルを選択してください");
        return;
    }

    const reader = new FileReader();
    reader.onload = function(e) {
        const csvText = e.target.result;
        const ranges = parseDelimited(csvText);
        const json = buildOTIO(ranges, fps, videoPath);
        document.getElementById("output").value = json;
    };
    reader.readAsText(file);
}

function downloadJSON() {
    const text = document.getElementById("output").value;
    const blob = new Blob([text], { type: "application/json" });
    const url = URL.createObjectURL(blob);

    const a = document.createElement("a");
    a.href = url;
    a.download = "output.otio";
    a.click();

    URL.revokeObjectURL(url);
}
</script>

</body>
</html>
